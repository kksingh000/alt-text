[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-text-scorer"
version = "0.1.0"
description = "Rule-based alt text quality scorer — shared core for the alt-text FastAPI backend"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["alt_text_scorer*"]

[tool.setuptools.package-data]
alt_text_scorer = ["*.json"]
